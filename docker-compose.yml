version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: vulnforge_user
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
      POSTGRES_DB: vulnforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass CHANGE_ME_REDIS_PASSWORD
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnforge_user
      - POSTGRES_PASSWORD=CHANGE_ME_STRONG_PASSWORD
      - POSTGRES_DB=vulnforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=CHANGE_ME_REDIS_PASSWORD
      - SECRET_KEY=CHANGE_ME_GENERATE_WITH_SCRIPTS_LONG_ENOUGH_FOR_TESTING
      - FIRST_SUPERUSER_PASSWORD=CHANGE_ME_ADMIN_PASSWORD_12345
      - PYTHONPATH=/app
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - VOYAGE_API_KEY_FALLBACK=${VOYAGE_API_KEY_FALLBACK:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RAG_INGEST_ENABLED=${RAG_INGEST_ENABLED:-false}
      - RAG_INGEST_SOURCES=${RAG_INGEST_SOURCES:-github_advisories}
      - LLM_PROVIDER=${LLM_PROVIDER:-cli}
      - LLM_CLI_COMMAND=${LLM_CLI_COMMAND:-claude}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    depends_on:
      - db
      - redis

  # ── Background workers (share the backend image + environment) ──────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnforge_user
      - POSTGRES_PASSWORD=CHANGE_ME_STRONG_PASSWORD
      - POSTGRES_DB=vulnforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=CHANGE_ME_REDIS_PASSWORD
      - SECRET_KEY=CHANGE_ME_GENERATE_WITH_SCRIPTS_LONG_ENOUGH_FOR_TESTING
      - FIRST_SUPERUSER_PASSWORD=CHANGE_ME_ADMIN_PASSWORD_12345
      - PYTHONPATH=/app
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - VOYAGE_API_KEY_FALLBACK=${VOYAGE_API_KEY_FALLBACK:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RAG_INGEST_ENABLED=${RAG_INGEST_ENABLED:-false}
      - RAG_INGEST_SOURCES=${RAG_INGEST_SOURCES:-github_advisories}
      - LLM_PROVIDER=${LLM_PROVIDER:-cli}
      - LLM_CLI_COMMAND=${LLM_CLI_COMMAND:-claude}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnforge_user
      - POSTGRES_PASSWORD=CHANGE_ME_STRONG_PASSWORD
      - POSTGRES_DB=vulnforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=CHANGE_ME_REDIS_PASSWORD
      - SECRET_KEY=CHANGE_ME_GENERATE_WITH_SCRIPTS_LONG_ENOUGH_FOR_TESTING
      - FIRST_SUPERUSER_PASSWORD=CHANGE_ME_ADMIN_PASSWORD_12345
      - PYTHONPATH=/app
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - VOYAGE_API_KEY_FALLBACK=${VOYAGE_API_KEY_FALLBACK:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RAG_INGEST_ENABLED=${RAG_INGEST_ENABLED:-false}
      - RAG_INGEST_SOURCES=${RAG_INGEST_SOURCES:-github_advisories}
      - LLM_PROVIDER=${LLM_PROVIDER:-cli}
      - LLM_CLI_COMMAND=${LLM_CLI_COMMAND:-claude}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Exclude node_modules from being overwritten by the host to use the container's node_modules
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
